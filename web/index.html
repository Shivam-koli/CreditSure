    <div class="modal-actions"><button class="btn" id="profileSave">Save</button></div>
  </div>
</div>

<!-- ---------- Settings modal ---------- -->

  <div class="modal">
    <div class="modal-head"><h3>Settings</h3><button class="icon-btn" id="settingsClose" data-tip="Close">&#10005;</button></div>

    <label class="switch-row"><input type="checkbox" id="setAutoRefresh" /> Auto-refresh Model Lab &amp; Monitoring every 30s</label>
    <div class="modal-actions"><button class="btn" id="settingsSave">Save</button></div>
